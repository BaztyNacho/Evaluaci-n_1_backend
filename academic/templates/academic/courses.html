{% extends 'academic/base.html' %}
{% block title %}Cursos{% endblock %}

{% block content %}
<h1 class="mb-4">Cursos</h1>

<!-- Formulario de Crear / Editar. El select de Profesor se llena vía fetch() al cargar la página -->
<form id="course-form" class="row g-2 mb-4 border p-3 rounded bg-light">
    <input type="hidden" id="course-id" value="">
    <div class="col-md-4">
        <input type="text" id="course-name" class="form-control" placeholder="Nombre del curso" required>
    </div>
    <div class="col-md-4">
        <select id="course-teacher" class="form-select" required>
            <option value="">Seleccione un profesor...</option>
        </select>
    </div>
    <div class="col-md-4">
        <button type="submit" class="btn btn-primary" id="course-submit-btn">Crear Curso</button>
        <button type="button" class="btn btn-secondary d-none" id="course-cancel-btn">Cancelar</button>
    </div>
</form>

<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre del Curso</th>
            <th>Profesor Asignado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody id="courses-tbody">
        <tr>
            <td colspan="4" class="text-center">Cargando cursos...</td>
        </tr>
    </tbody>
</table>
{% endblock %}

{% block extra_js %}
<script>
    const form = document.getElementById('course-form');
    const idField = document.getElementById('course-id');
    const nameField = document.getElementById('course-name');
    const teacherSelect = document.getElementById('course-teacher');
    const submitBtn = document.getElementById('course-submit-btn');
    const cancelBtn = document.getElementById('course-cancel-btn');
    const tbody = document.getElementById('courses-tbody');

    // Django exige el CSRF token en peticiones POST/PUT/DELETE aunque sea vía fetch.
    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    const csrftoken = getCookie('csrftoken');

    // Llena el <select> de profesores consultando /api/teachers/
    function loadTeacherOptions() {
        return fetch('/api/teachers/')
            .then(response => response.json())
            .then(data => {
                data.forEach(teacher => {
                    const opt = document.createElement('option');
                    opt.value = teacher.id;
                    opt.textContent = `${teacher.first_name} ${teacher.last_name}`;
                    teacherSelect.appendChild(opt);
                });
            });
    }

    // Carga (o recarga) la tabla completa de cursos
    function loadCourses() {
        fetch('/api/courses/')
            .then(response => response.json())
            .then(data => {
                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">No hay cursos registrados.</td></tr>';
                    return;
                }
                data.forEach(course => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${course.id}</td>
                        <td>${course.name}</td>
                        <td>${course.teacher_name}</td>
                        <td>
                            <button class="btn btn-sm btn-warning btn-edit" data-id="${course.id}" data-name="${course.name}" data-teacher="${course.teacher}">Editar</button>
                            <button class="btn btn-sm btn-danger btn-delete" data-id="${course.id}">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error al obtener los cursos:', error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error al cargar los datos.</td></tr>';
            });
    }

    // Crear (POST) o Editar (PUT) según si hay un ID cargado en el form
    form.addEventListener('submit', function (e) {
        e.preventDefault();
        const id = idField.value;
        const payload = {
            name: nameField.value,
            teacher: teacherSelect.value,
        };
        const url = id ? `/api/courses/${id}/` : '/api/courses/';
        const method = id ? 'PUT' : 'POST';

        fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken,
            },
            body: JSON.stringify(payload),
        })
            .then(response => {
                if (!response.ok) throw new Error('Error al guardar el curso');
                return response.json();
            })
            .then(() => {
                resetForm();
                loadCourses();
            })
            .catch(error => alert(error.message));
    });

    // Click en "Editar": precarga el formulario con los datos de esa fila
    tbody.addEventListener('click', function (e) {
        if (e.target.classList.contains('btn-edit')) {
            const btn = e.target;
            idField.value = btn.dataset.id;
            nameField.value = btn.dataset.name;
            teacherSelect.value = btn.dataset.teacher;
            submitBtn.textContent = 'Guardar Cambios';
            cancelBtn.classList.remove('d-none');
        }

        // Click en "Eliminar": pide confirmación y hace DELETE
        if (e.target.classList.contains('btn-delete')) {
            const id = e.target.dataset.id;
            if (!confirm('¿Seguro que deseas eliminar este curso? Esto también eliminará sus inscripciones.')) return;

            fetch(`/api/courses/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': csrftoken },
            })
                .then(response => {
                    if (!response.ok) throw new Error('Error al eliminar el curso');
                    loadCourses();
                })
                .catch(error => alert(error.message));
        }
    });

    // Botón "Cancelar": vuelve el formulario a modo "Crear"
    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
        idField.value = '';
        form.reset();
        teacherSelect.value = '';
        submitBtn.textContent = 'Crear Curso';
        cancelBtn.classList.add('d-none');
    }

    // Al cargar la página: primero llenamos el select de profesores, luego la tabla
    document.addEventListener('DOMContentLoaded', function () {
        loadTeacherOptions().then(loadCourses);
    });
</script>
{% endblock %}
